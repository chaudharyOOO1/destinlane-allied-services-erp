name: ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend regression and PostgreSQL workflow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Run regression tests
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          engine = create_engine(os.environ['TEST_POSTGRES_ADMIN_URL'])
          with engine.begin() as conn:
              conn.exec_driver_sql('CREATE ROLE anon NOLOGIN')
              conn.exec_driver_sql('CREATE ROLE authenticated NOLOGIN')
          PY
          python -m pytest tests -q
      - name: Validate imports
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
        run: python -c "from app.main import app; print('FastAPI app import OK:', app.title)"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
